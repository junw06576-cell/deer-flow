# Optional Gateway-only LLM Wiki compatibility mount.
# Load this after docker-compose.yaml only after the schema-1 export passes its
# offline validator. Do not add this volume to sandbox or provisioner services.
services:
  gateway:
    volumes:
      - type: bind
        source: ${REGIONAL_LLM_WIKI_COMPAT_ROOT:?Set REGIONAL_LLM_WIKI_COMPAT_ROOT to the validated schema-1 export root}
        target: /mnt/regional-llm-wiki-runtime
        read_only: true
        bind:
          create_host_path: false
