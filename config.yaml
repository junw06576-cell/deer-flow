# DeerFlow Configuration
# Generated by 'make setup' on 2026-07-20
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 28
log_level: info
logging:
  enhance:
    enabled: false
    format: text
token_usage:
  enabled: false
token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0
max_recursion_limit: 1000
models:
- name: deepseek-v4-flash
  display_name: Wincode / deepseek-v4-flash
  use: langchain_openai:ChatOpenAI
  model: deepseek-v4-flash
  api_key: $OPENAI_API_KEY
  base_url: $OPENAI_BASE_URL
  timeout: 600.0
  max_retries: 2
  max_tokens: 8192
  supports_vision: false
  supports_thinking: true
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
- name: ragflow
tools:
- name: web_search
  use: deerflow.community.ddg_search.tools:web_search_tool
  group: web
  max_results: 5
- name: web_fetch
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  group: web
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash

# ragflow工具
- name: ragflow_chat
  use: ragflow_tools:ragflow_chat
  group: ragflow
- name: ragflow_list_datasets
  use: ragflow_tools:ragflow_list_datasets
  group: ragflow
- name: ragflow_search
  use: ragflow_tools:ragflow_search
  group: ragflow
  
tool_search:
  enabled: false
tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools:
  - read_file
  - read_file_tool
suggestions:
  enabled: false
input_polish:
  enabled: false
  max_chars: 4000
  model_name: null
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 50
  max_tracked_threads: 100
  tool_freq_warn: 80
  tool_freq_hard_limit: 150
read_before_write:
  enabled: false
safety_finish_reason:
  enabled: false
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  bash_command_timeout: 600
  mounts:
    # reg-wiki-kb：同步程序发布的五目录 Markdown 快照和索引。
    # 使用单一父目录挂载，避免只读父卷下创建子挂载点失败。
    - host_path: /opt/regional_wiki_kb/reg-wiki-scope
      container_path: /mnt/knowledge
      read_only: true
    # auto-req-analysis skill 的产物/审计目录（PROCESS_DIR=/mnt/skills/过程文件），
    # 用可写子挂载覆盖 /mnt/skills 只读父挂载；沙箱进程文件按工作项 ID 落盘
    - host_path: /opt/deer-flow/auto-dev-work/过程文件
      container_path: /mnt/skills/过程文件
      read_only: false
    # agent 自行建立的 workspace 软链产物（/mnt/user-data/workspace/auto-dev-work/过程文件）
    # 也归一收口到同一宿主机目录，避免产物分散在线程目录
    - host_path: /opt/deer-flow/auto-dev-work
      container_path: /mnt/user-data/workspace/auto-dev-work
      read_only: false
  environment:
    REDIS_HOST: host.docker.internal
    REDIS_PORT: "26380"
skills:
  container_path: /mnt/skills
skill_scan:
  enabled: false
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: false
  model_name: null
  trigger:
  - type: tokens
    value: 32000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  injection_enabled: true
  shutdown_flush_timeout_seconds: 30.0
  manager_class: deermem
  mode: middleware
  backend_config:
    storage_path: ''
    debounce_seconds: 30
    model:
      provider: openai
      model: deepseek-v4-flash
      api_key: $OPENAI_API_KEY
      base_url: $OPENAI_BASE_URL
    max_facts: 100
    fact_confidence_threshold: 0.7
    max_injection_tokens: 2000
    token_counting: tiktoken
    guaranteed_categories:
    - correction
    guaranteed_token_budget: 500
    staleness_review_enabled: true
    staleness_age_days: 90
    staleness_min_candidates: 3
    staleness_max_removals_per_cycle: 10
    staleness_protected_categories:
    - correction
    staleness_max_lifetime_multiplier: 20.0
    staleness_max_extension_days: 3650
    consolidation_enabled: false
    consolidation_min_facts: 8
    consolidation_max_groups_per_cycle: 3
    consolidation_max_sources: 8
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
  security_fail_closed: true
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true
scheduler:
  enabled: false
  poll_interval_seconds: 5
  lease_seconds: 120
  max_concurrent_runs: 3
  min_once_delay_seconds: 60
run_ownership:
  lease_seconds: 30
  grace_seconds: 10
  heartbeat_enabled: false
authorization:
  enabled: false
channel_connections:
  enabled: false
  telegram:
    enabled: false
  slack:
    enabled: false
  discord:
    enabled: false
  feishu:
    enabled: false
  dingtalk:
    enabled: false
  wechat:
    enabled: false
  wecom:
    enabled: false
