<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFS-BUDDY 流式交互测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4a6cf7;
    --primary-hover: #3b5de7;
    --success: #2e7d32;
    --warning: #e65100;
    --info: #1565c0;
    --bg: #f0f2f5;
    --card-bg: #fff;
    --text: #1a1a2e;
    --text-secondary: #666;
    --border: #e0e0e0;
    --user-bubble: #4a6cf7;
    --user-text: #fff;
    --ai-bubble: #f0f0f0;
    --ai-text: #333;
    --system-bg: #e8f5e9;
    --system-border: #a5d6a7;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  .header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .header h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .header .subtitle { font-size: 12px; color: var(--text-secondary); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 500; }
  .badge-live { background: #ffebee; color: #c62828; }
  .badge-idle { background: #e8f5e9; color: #2e7d32; }

  /* Config panel */
  .config-toggle { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; color: var(--text-secondary); }
  .config-toggle:hover { background: #f5f5f5; }
  .config-panel { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 24px; max-height: 0; overflow: hidden; transition: max-height .3s ease, padding .3s ease; }
  .config-panel.open { max-height: 400px; padding: 16px 24px; overflow-y: auto; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .config-grid .full { grid-column: 1 / -1; }
  .config-grid label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 2px; }
  .config-grid input, .config-grid select { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; font-family: inherit; }
  .config-grid input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(74,108,247,.12); }

  /* Chat area */
  .chat-area { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
  .chat-area .empty-hint { text-align: center; color: #bbb; font-size: 14px; padding: 60px 0; line-height: 2; }
  .chat-area .empty-hint .key-hint { display: inline-block; background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 2px 8px; font-size: 12px; font-family: monospace; }

  /* Messages */
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-break: break-word; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg-ai { align-self: flex-start; background: var(--ai-bubble); color: var(--ai-text); border-bottom-left-radius: 4px; }
  .msg-ai .msg-label { font-size: 11px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
  .msg-ai .msg-content { white-space: pre-wrap; }
  .msg-ai .msg-content code { background: #e8e8e8; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .msg-ai .msg-tool-call { background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 12px; }
  .msg-ai .msg-tool-call .tool-name { font-weight: 600; color: var(--info); }
  .msg-ai .msg-tool-call .tool-args { font-family: monospace; font-size: 11px; color: #555; margin-top: 4px; white-space: pre-wrap; }
  .msg-ai .msg-tool-result { background: #f5f5f5; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 4px; font-size: 11px; font-family: monospace; max-height: 200px; overflow-y: auto; }
  .msg-ai .msg-tool-result .truncated { color: #999; font-style: italic; }

  /* System events (phase cards) */
  .msg-system { align-self: center; width: 100%; max-width: 100%; }
  .system-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow); }
  .system-card .sc-header { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .system-card .sc-header .sc-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .system-card .sc-header .sc-icon.info { background: #e3f2fd; color: var(--info); }
  .system-card .sc-header .sc-icon.success { background: #e8f5e9; color: var(--success); }
  .system-card .sc-header .sc-icon.warning { background: #fff3e0; color: var(--warning); }
  .system-card .sc-header .sc-icon.error { background: #ffebee; color: #c62828; }
  .system-card .sc-body { font-size: 12px; color: var(--text-secondary); white-space: pre-wrap; }
  .system-card .sc-body .sc-verdict { font-size: 14px; font-weight: 700; color: var(--text); margin: 4px 0; }
  .system-card .sc-body .sc-detail { margin-top: 4px; }
  .system-card .sc-body .sc-detail table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .system-card .sc-body .sc-detail td { padding: 3px 6px; border-bottom: 1px solid #f0f0f0; }
  .system-card .sc-body .sc-detail td:first-child { font-weight: 500; color: var(--text-secondary); width: 100px; }
  .system-card .sc-body .sc-json { background: #1e1e2e; color: #cdd6f4; border-radius: 6px; padding: 8px 10px; font-family: monospace; font-size: 11px; white-space: pre-wrap; max-height: 300px; overflow: auto; margin-top: 6px; }

  /* Input area */
  .input-area { background: var(--card-bg); border-top: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .input-area input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 24px; font-size: 13px; outline: none; transition: border-color .2s; }
  .input-area input:focus { border-color: var(--primary); }
  .input-area input:disabled { background: #f5f5f5; cursor: not-allowed; }
  .input-area .btn-send { background: var(--primary); color: #fff; border: none; border-radius: 24px; padding: 10px 22px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 6px; }
  .input-area .btn-send:hover { background: var(--primary-hover); }
  .input-area .btn-send:disabled { background: #a0b4f7; cursor: not-allowed; }
  .input-area .btn-stop { background: #e53935; color: #fff; border: none; border-radius: 24px; padding: 10px 22px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .input-area .btn-stop:hover { background: #c62828; }

  /* Status bar */
  .status-bar { background: var(--card-bg); border-top: 1px solid var(--border); padding: 4px 24px; font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between; flex-shrink: 0; }
  .status-bar .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-bar .status-dot.green { background: #4caf50; }
  .status-bar .status-dot.red { background: #f44336; }
  .status-bar .status-dot.yellow { background: #ff9800; }
  .status-bar .status-dot.gray { background: #9e9e9e; }

  /* Scrollbar */
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .chat-area::-webkit-scrollbar-thumb:hover { background: #aaa; }

  @media (max-width: 720px) {
    .config-grid { grid-template-columns: 1fr; }
    .header { padding: 10px 16px; }
    .chat-area { padding: 12px 16px; }
    .input-area { padding: 10px 16px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🎯 TFS-BUDDY 流式交互测试</h1>
    <div class="subtitle">通过 deerflow-service SSE 代理，实时查看 Agent 阶段事件</div>
  </div>
  <div class="header-actions">
    <span class="badge" id="statusBadge">⚪ 空闲</span>
    <button class="config-toggle" id="configToggle" onclick="toggleConfig()">⚙️ 配置</button>
    <button class="config-toggle" onclick="clearChat()">🗑️ 清空</button>
  </div>
</div>

<div class="config-panel" id="configPanel">
  <div class="config-grid">
    <div>
      <label>Gateway 地址</label>
      <input id="gwUrl" value="http://localhost:8003" placeholder="http://localhost:8003" />
    </div>
    <div>
      <label>Agent 名称</label>
      <input id="agentName" value="auto-analysis-agent" />
    </div>
    <div>
      <label>Work Item ID</label>
      <input id="workItemId" value="234883" />
    </div>
    <div>
      <label>TFS Project</label>
      <input id="tfsProject" value="RDA-03-数据集成管理软件" />
    </div>
    <div>
      <label>Collection</label>
      <input id="collection" value="WN_Data_Platform" />
    </div>
    <div>
      <label>TFS PAT</label>
      <input id="tfsPat" type="password" value="dcfwxvnbtg66lkdtezus5l77yrrz5fqnzlsmwwhi2n3hp7izavma" />
    </div>
    <div class="full">
      <label>Stream Mode</label>
      <select id="streamMode">
        <option value="values">values（完整状态快照）</option>
        <option value="messages-tuple">messages-tuple（消息块流）</option>
        <option value="values,messages-tuple" selected>values + messages-tuple（推荐）</option>
        <option value="updates">updates（节点级更新）</option>
        <option value="custom">custom（自定义事件）</option>
      </select>
    </div>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="empty-hint" id="emptyHint">
    <div style="font-size: 28px; margin-bottom: 12px;">💬</div>
    <div>配置参数后点击「发送」开始流式分析</div>
    <div style="margin-top: 8px; color: #ccc;">支持 Enter 发送 / Shift+Enter 换行</div>
    <div style="margin-top: 4px; color: #ccc;">Agent 的每个阶段事件会实时展示</div>
  </div>
</div>

<div class="input-area">
  <input id="msgInput" placeholder="输入消息，或直接点击发送开始分析..." onkeydown="onInputKeydown(event)" disabled />
  <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled>
    <span>▶</span> 发送
  </button>
  <button class="btn-stop" id="btnStop" onclick="stopStream()" style="display:none;">⏹ 停止</button>
</div>

<div class="status-bar">
  <span id="statusLeft"><span class="status-dot gray"></span>就绪</span>
  <span id="statusRight">SSE 流</span>
</div>

<script>
// ── State ──
let _currentRunId = null;
let _currentThreadId = null;
let _abortController = null;
let _isStreaming = false;
let _lastValuesState = null;
let _seenMessageIds = new Set();

// ── DOM refs ──
const $ = id => document.getElementById(id);
const chatArea = $('chatArea');
const emptyHint = $('emptyHint');

// ── SSE parser from ReadableStream ──
async function* parseSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let event = '', data = '', eventId = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) {
      if (event && data) {
        yield { event, data: parseData(data), id: eventId };
      }
      break;
    }
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop() || '';

    for (const line of lines) {
      if (line === '') {
        if (event && data) {
          yield { event, data: parseData(data), id: eventId };
        }
        event = ''; data = ''; eventId = '';
      } else if (line.startsWith('event: ')) {
        event = line.slice(7).trim();
      } else if (line.startsWith('data: ')) {
        data += line.slice(6);
      } else if (line.startsWith('id: ')) {
        eventId = line.slice(4).trim();
      } else if (line.startsWith(':')) {
        // heartbeat
      } else if (line.startsWith('data:')) {
        data += line.slice(5);
      }
    }
  }
}

function parseData(raw) {
  try { return JSON.parse(raw); } catch { return raw; }
}

// ── Message rendering ──
function addSystemCard(icon, iconType, title, bodyHtml, extraClass = '') {
  emptyHint?.remove();
  const div = document.createElement('div');
  div.className = `msg msg-system ${extraClass}`;
  div.innerHTML = `<div class="system-card">
    <div class="sc-header">
      <div class="sc-icon ${iconType}">${icon}</div>
      ${title}
    </div>
    <div class="sc-body">${bodyHtml}</div>
  </div>`;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addUserMessage(text) {
  emptyHint?.remove();
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.textContent = text;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addAIMessage(text, extra = '') {
  emptyHint?.remove();
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML = `<div class="msg-label">🤖 Agent</div>
    <div class="msg-content">${escapeHtml(text)}</div>${extra}`;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addToolCall(name, args) {
  emptyHint?.remove();
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  const argsStr = typeof args === 'string' ? args : JSON.stringify(args, null, 2);
  div.innerHTML = `<div class="msg-label">🔧 工具调用</div>
    <div class="msg-tool-call">
      <div class="tool-name">🛠 ${escapeHtml(name)}</div>
      <div class="tool-args">${escapeHtml(argsStr)}</div>
    </div>`;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addToolResult(result) {
  const msgs = chatArea.querySelectorAll('.msg-ai');
  const last = msgs[msgs.length - 1];
  if (!last) return;
  const resultDiv = document.createElement('div');
  resultDiv.className = 'msg-tool-result';
  const resultStr = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
  const truncated = resultStr.length > 500 ? resultStr.slice(0, 500) + '\n... (已截断)' : resultStr;
  resultDiv.innerHTML = `<div style="font-weight:600;color:#666;margin-bottom:2px;">📄 结果</div>${escapeHtml(truncated)}`;
  last.appendChild(resultDiv);
  scrollToBottom();
}

// ── SSE event handlers ──
function handleMetadata(data) {
  _currentRunId = data.run_id;
  addSystemCard('ℹ️', 'info', '运行创建', `Run ID: <code>${data.run_id}</code>`);
  updateStatus('running', '运行中');
}

function handleValues(data) {
  _lastValuesState = data;
  const messages = data.messages || [];
  if (messages.length === 0) return;
  const lastMsg = messages[messages.length - 1];
  if (!lastMsg) return;
  const msgId = lastMsg.id || lastMsg.content?.substring(0, 40);
  if (_seenMessageIds.has(msgId)) return;
  _seenMessageIds.add(msgId);
  const type = lastMsg.type || lastMsg.role;
  const content = lastMsg.content;
  if (type === 'ai' || type === 'assistant') {
    if (typeof content === 'string' && content.trim()) addAIMessage(content);
    const toolCalls = lastMsg.tool_calls || lastMsg.invocation_params?.tool_calls || [];
    for (const tc of toolCalls) addToolCall(tc.name || tc.function?.name, tc.args || tc.function?.arguments || {});
  } else if (type === 'tool' || type === 'tool_result') {
    addToolResult(content);
  }
}

function handleUpdates(data) {
  for (const [node, value] of Object.entries(data)) {
    if (value && value.messages) { handleValues(value); }
    else { addSystemCard('🔄', 'info', `节点: ${escapeHtml(node)}`, `<code>${escapeHtml(JSON.stringify(value, null, 2).slice(0, 300))}</code>`); }
  }
}

function handleMessages(data) {
  if (!Array.isArray(data)) return;
  const msg = data[2] || data[1];
  if (!msg) return;
  const type = msg.type || msg.role;
  const content = msg.content;
  if (type === 'ai' || type === 'assistant') {
    if (typeof content === 'string' && content.trim()) addAIMessage(content);
    const toolCalls = msg.tool_calls || [];
    for (const tc of toolCalls) addToolCall(tc.name || tc.function?.name, tc.args || tc.function?.arguments || {});
  } else if (type === 'tool') {
    addToolResult(content);
  }
}

function handleCustom(data) {
  const t = data.type || data.event;
  if (t === 'task_started') addSystemCard('📋', 'info', `子任务: ${escapeHtml(data.name || '')}`, data.description ? escapeHtml(data.description) : '');
  else if (t === 'task_completed') addSystemCard('✅', 'success', `子任务完成: ${escapeHtml(data.name || '')}`, '');
  else if (t === 'task_error') addSystemCard('❌', 'error', '子任务错误', escapeHtml(data.error || ''));
  else addSystemCard('📌', 'info', '自定义事件', `<code>${escapeHtml(JSON.stringify(data, null, 2).slice(0, 500))}</code>`);
}

function handleEnd() {
  _isStreaming = false;
  updateStatus('idle', '已完成');
  $('btnSend').disabled = false;
  $('btnStop').style.display = 'none';
  $('msgInput').disabled = false;
  $('msgInput').placeholder = '输入跟进消息...';
  addSystemCard('🏁', 'success', '流结束', 'Agent 运行完成');
}

function handleError(data) {
  _isStreaming = false;
  updateStatus('error', '错误');
  $('btnSend').disabled = false;
  $('btnStop').style.display = 'none';
  $('msgInput').disabled = false;
  addSystemCard('❌', 'error', '流错误', typeof data === 'string' ? data : JSON.stringify(data, null, 2));
}

// ── Main: start analysis via deerflow-service proxy ──
async function startAnalysis(initialMessage) {
  const gw = $('gwUrl').value.replace(/\/+$/, '');
  const wid = $('workItemId').value.trim();
  const collection = $('collection').value.trim();
  const project = $('tfsProject').value.trim();
  const pat = $('tfsPat').value.trim();
  const agentName = $('agentName').value.trim() || 'auto-analysis-agent';
  const streamModeRaw = $('streamMode').value;

  if (!wid) { addSystemCard('⚠️', 'warning', '参数错误', '请填写 Work Item ID'); return; }
  if (!pat) { addSystemCard('⚠️', 'warning', '参数错误', '请填写 TFS PAT'); return; }

  const tid = `${collection}-${wid}`;
  _currentThreadId = tid;
  _seenMessageIds = new Set();

  // Show user message
  addUserMessage(initialMessage || `开始分析 TFS #${wid}（${collection} / ${project}）`);

  // Build prompt matching deerflow-service format
  const redisKey = `auto-req:qc:plan:${collection}:${wid}`;
  const promptText = initialMessage ? initialMessage :
    `System automation task. Execute the requirement analysis/QC workflow using the agent's configured requirement-analysis skill. Do not ask for clarification and do not stop after summarizing this input. Read the configured skill instructions, run the required workflow, and write the authoritative result to Redis using the provided redis_key. Return only a short JSON status summary when the workflow is finished.

Task input JSON:
{"action": "auto_req_analysis", "collection_name": "${collection}", "work_item_id": ${parseInt(wid, 10)}, "tfs_project": "${project}", "tfs_pat": "${pat}", "redis_key": "${redisKey}"}`;

  _abortController = new AbortController();
  _isStreaming = true;

  $('btnSend').disabled = true;
  $('btnStop').style.display = 'inline-flex';
  $('msgInput').disabled = true;
  updateStatus('running', '连接中...');

  addSystemCard('🚀', 'info', '启动任务', `Thread: <code>${tid}</code><br>Agent: <code>${agentName}</code><br>Stream Mode: <code>${streamModeRaw}</code>`);

  try {
    // POST to deerflow-service SSE proxy
    // 走 nginx（有 /deerflow-service 前缀）vs 直连 localhost 路径不同
    const isLocal = gw.includes('localhost') || gw.includes('127.0.0.1');
    const proxyUrl = isLocal
      ? `${gw}/api/v1/analysis/stream`
      : `${gw}/deerflow-service/api/v1/analysis/stream`;
    const payload = {
      collection_name: collection,
      work_item_id: parseInt(wid, 10),
      tfs_project: project,
      tfs_pat: pat,
      agent_name: agentName,
      stream_mode: streamModeRaw,
      prompt: promptText,
    };

    const response = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: _abortController.signal,
    });

    if (!response.ok) {
      let errBody = '';
      try { errBody = await response.text(); } catch {}
      throw new Error(`HTTP ${response.status}: ${errBody.slice(0, 300) || response.statusText}`);
    }

    updateStatus('running', '接收流中...');

    for await (const event of parseSSE(response)) {
      if (_abortController.signal.aborted) break;
      switch (event.event) {
        case 'metadata': handleMetadata(event.data); break;
        case 'values': handleValues(event.data); break;
        case 'updates': handleUpdates(event.data); break;
        case 'messages':
        case 'messages-tuple': handleMessages(event.data); break;
        case 'messages/complete': break;
        case 'custom': handleCustom(event.data); break;
        case 'error': handleError(event.data); break;
        case 'end': handleEnd(); return;
        default:
          if (event.event && !event.event.startsWith(':')) {
            addSystemCard('📄', 'info', `事件: ${event.event}`, `<code>${escapeHtml(JSON.stringify(event.data, null, 2).slice(0, 400))}</code>`);
          }
      }
    }
    if (_isStreaming) handleEnd();
  } catch (err) {
    if (err.name === 'AbortError') {
      addSystemCard('⏹', 'warning', '已停止', '用户手动停止了流');
    } else {
      addSystemCard('❌', 'error', '请求失败', escapeHtml(err.message));
    }
    _isStreaming = false;
    $('btnSend').disabled = false;
    $('btnStop').style.display = 'none';
    $('msgInput').disabled = false;
    updateStatus('error', '失败');
  }
}

// ── Send message ──
async function sendMessage() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text) { startAnalysis(''); return; }
  input.value = '';
  await startAnalysis(text);
}

function stopStream() {
  if (_abortController) {
    _abortController.abort();
    _isStreaming = false;
    $('btnSend').disabled = false;
    $('btnStop').style.display = 'none';
    $('msgInput').disabled = false;
    updateStatus('idle', '已停止');
  }
}

// ── UI helpers ──
function toggleConfig() {
  const panel = $('configPanel');
  const btn = $('configToggle');
  panel.classList.toggle('open');
  btn.textContent = panel.classList.contains('open') ? '✖ 关闭' : '⚙️ 配置';
}

function clearChat() {
  chatArea.innerHTML = `<div class="empty-hint" id="emptyHint">
    <div style="font-size: 28px; margin-bottom: 12px;">💬</div>
    <div>配置参数后点击「发送」开始流式分析</div>
    <div style="margin-top: 8px; color: #ccc;">支持 Enter 发送 / Shift+Enter 换行</div>
    <div style="margin-top: 4px; color: #ccc;">Agent 的每个阶段事件会实时展示</div>
  </div>`;
  _currentRunId = null;
  _currentThreadId = null;
  _lastValuesState = null;
  _seenMessageIds = new Set();
  $('msgInput').value = '';
  $('msgInput').disabled = false;
  $('msgInput').placeholder = '输入消息，或直接点击发送开始分析...';
  updateStatus('idle', '就绪');
}

function updateStatus(state, text) {
  const badge = $('statusBadge');
  const left = $('statusLeft');
  const dotColors = { idle: 'gray', running: 'yellow', error: 'red', connected: 'green' };
  const labels = { idle: '⚪ 空闲', running: '🟡 运行中', error: '🔴 错误', connected: '🟢 已连接' };
  badge.textContent = labels[state] || '⚪ 空闲';
  left.innerHTML = `<span class="status-dot ${dotColors[state] || 'gray'}"></span>${text}`;
}

function scrollToBottom() {
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 10);
}

function escapeHtml(str) {
  if (str == null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  updateStatus('idle', '就绪');
  $('btnSend').disabled = false;
  $('msgInput').disabled = false;
});
</script>
</body>
</html>
